<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>


    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

</head>

<body>


    <div class="page">

        <div class="case">


            <div class="left">



                <div class="output">


                    <div class="output-text" id="output">

                        

                    </div>

                </div> <!-- output -->



                <div class="numeric-keypad">

                    <div class="keypad-row">
                        <div class="key" id="n7">
                            <div class="key-text">7</div>
                        </div>
                        <div class="key" id="n8">
                            <div class="key-text">8</div>
                        </div>
                        <div class="key" id="n9">
                            <div class="key-text">9</div>
                        </div>
                    </div><!-- keypad row top-->


                    <div class="keypad-row">
                        <div class="key" id="n4">
                            <div class="key-text">4</div>
                        </div>
                        <div class="key" id="n5">
                            <div class="key-text">5</div>
                        </div>
                        <div class="key" id="n6">
                            <div class="key-text">6</div>
                        </div>
                    </div><!-- keypad row mid-->


                    <div class="keypad-row">
                        <div class="key" id="n1">
                            <div class="key-text">1</div>
                        </div>
                        <div class="key" id="n2">
                            <div class="key-text">2</div>
                        </div>
                        <div class="key" id="n3">
                            <div class="key-text">3</div>
                        </div>
                    </div><!-- keypad row bottom-->

                </div> <!-- numeric keypad -->



            </div> <!-- left -->



            <div class="operations-keypad">

                <div class="key" id="op0">
                    <div class="key-text"> +</div>
                </div>
                <div class="key" id="op1">
                    <div class="key-text"> - </div>
                </div>
                <div class="key" id="op2">
                    <div class="key-text"> * </div>
                </div>
                <div class="key" id="op3">
                    <div class="key-text"> / </div>
                </div>
                <div class="key" id="op4">
                    <div class="key-text"> = </div>
                </div>

            </div>


        </div> <!-- case -->

    </div> <!-- page-->



    <script src="scripts.js"></script>
</body>

</html>
